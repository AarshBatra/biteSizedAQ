# ============================================================================
# Keyword list — PIB environment / pollution / climate tracker.
#
# Scope: MAXIMUM RECALL. Deliberately over-inclusive across air, water, soil,
# waste, climate, energy, chemistry, health, institutions, and Indian scheme
# names. Expect false positives — prune groups by commenting them out
# (add # at the start of a line) once you see what noise they bring.
#
# Matching (all handled in code — nothing to configure here):
#   * case-insensitive
#   * WORD-BOUNDED  ("GRAP" won't match "demographic")
#   * space = space OR hyphen/dash  ("clean air" finds "clean-air")
#   * automatic plural  ("emission" also matches "emissions") — so list
#     singulars; add irregular plurals explicitly only if needed
#   * checked against BOTH title AND body text
#
# Groups are for your readability; the code flattens the whole list.
# ============================================================================

